# CHẶN MERGE KHI LUỒNG BILL HỎNG.
#
# Chạy mỗi khi mở hoặc cập nhật PR test -> main. Máy chủ thật + Postgres thật,
# không giả lập gì cả.
#
# Điều bộ này canh: code mới chạy đúng trên DỮ LIỆU KHÔNG PHẢI DO NÓ TẠO RA.
# Dữ liệu trên production do nhiều đời code cũ đẻ ra và nằm lại; tests/billcu.js
# dựng thẳng những hình dạng đó rồi mới bật máy chủ, để migration lúc khởi động
# phải xử lý chúng y như một lần deploy thật.
#
# ĐỂ CI NÀY CÓ TÁC DỤNG, PHẢI BẬT BRANCH PROTECTION:
#   Settings -> Branches -> Add rule cho main
#   -> Require status checks to pass before merging -> chọn "luồng bill"
# Không bật thì CI chỉ là cái đèn báo, PR đỏ vẫn merge được như thường.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bill:
    name: luồng bill
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citest
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citest
      PORT: '4899'
      NODE_ENV: test
      JWT_SECRET: ci-secret-khong-dung-o-dau-khac
      TEST_FAKE_TRANSLATE: '1'
      # Múi giờ Việt Nam, KHÔNG phải UTC. Cột thời gian trong lược đồ là
      # 'timestamp without time zone'; chạy ở UTC thì NOW() của Postgres và
      # new Date() của Node trùng nhau và che mất lỗi lệch 7 tiếng.
      TZ: Asia/Ho_Chi_Minh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server-dashboard/package-lock.json

      - name: Cài gói
        working-directory: server-dashboard
        run: npm ci

      # Khoá sinh mới mỗi lượt chạy, không lưu ở đâu cả. Không dùng khoá thật
      # của production trong CI.
      - name: Sinh khoá mã hoá cho lượt chạy này
        run: echo "MESSAGE_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Chạy bộ kiểm thử luồng bill
        working-directory: server-dashboard
        run: node tests/chay.js
