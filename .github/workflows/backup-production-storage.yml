name: Backup production storage

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-production-storage
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      RCLONE_CONFIG_SOURCE_TYPE: s3
      RCLONE_CONFIG_SOURCE_PROVIDER: Other
      RCLONE_CONFIG_SOURCE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      RCLONE_CONFIG_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_SOURCE_REGION: ${{ secrets.STORAGE_REGION }}
      RCLONE_CONFIG_SOURCE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
      RCLONE_CONFIG_SOURCE_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_BACKUP_TYPE: s3
      RCLONE_CONFIG_BACKUP_PROVIDER: Other
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      RCLONE_CONFIG_BACKUP_REGION: us-east-005
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      RCLONE_CONFIG_BACKUP_FORCE_PATH_STYLE: "true"
      SOURCE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
      BACKUP_BUCKET: ${{ secrets.B2_BUCKET }}
    steps:
      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Copy storage to Backblaze B2
        run: >-
          rclone copy "source:$SOURCE_BUCKET" "backup:$BACKUP_BUCKET/storage"
          --fast-list --checkers 8 --transfers 4

      - name: Verify copied objects
        run: >-
          rclone check "source:$SOURCE_BUCKET" "backup:$BACKUP_BUCKET/storage"
          --one-way --size-only --fast-list
