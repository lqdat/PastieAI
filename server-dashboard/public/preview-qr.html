<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Preview Styled QR Poster</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a161f;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            color: #fff;
        }
        h2 { margin-bottom: 12px; }
        #poster-img {
            max-width: 680px;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
        }
        #status { margin-top: 10px; color: #ef2b9d; }
        #scan-result { margin-top: 6px; font-weight: bold; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
    <h2>Preview Styled QR Poster (Classy-Rounded, Finder Circles, Speech Bubble, Gradient)</h2>
    <div id="status">Đang tạo poster...</div>
    <div id="scan-result"></div>
    <div style="margin-top: 20px;">
        <img id="poster-img" alt="QR Poster" />
    </div>

    <script src="config.js?v=r143"></script>
    <script src="core.js?v=r143"></script>
    <script src="chat.js?v=r143"></script>
    <script src="qrcode.bundle.js?v=r143"></script>
    <script src="org-console.js?v=r143"></script>
    <script>
        window.addEventListener('load', async () => {
            const statusEl = document.getElementById('status');
            const scanEl = document.getElementById('scan-result');
            const imgEl = document.getElementById('poster-img');

            try {
                const dummyChatUrl = 'https://chattest.pastiechat.com/?code=qr_test123456&api=https://apitest.pastiechat.com';
                const dummyImageUrl = 'https://quickchart.io/qr?size=360&text=' + encodeURIComponent(dummyChatUrl);
                
                const blob = await createBrandedQrPoster(dummyImageUrl, {
                    businessName: 'Pastie Seafood Beach House',
                    businessNameEn: 'Pastie Seafood Beach House',
                    qrLabel: 'Bàn 08 • VIP Lounge',
                    agentLogoUrl: '/pastie-mark.png',
                    style: 'cobranded',
                    chatUrl: dummyChatUrl
                });

                imgEl.src = URL.createObjectURL(blob);
                statusEl.textContent = 'Tạo poster thành công!';
                statusEl.style.color = '#10b981';

                // Verify decode
                if (window.jsQR) {
                    const scanCanvas = document.createElement('canvas');
                    const sCtx = scanCanvas.getContext('2d');
                    const tempImg = new Image();
                    tempImg.src = imgEl.src;
                    await new Promise(r => tempImg.onload = r);
                    scanCanvas.width = tempImg.naturalWidth;
                    scanCanvas.height = tempImg.naturalHeight;
                    sCtx.drawImage(tempImg, 0, 0);
                    const sImgData = sCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
                    const code = window.jsQR(sImgData.data, sImgData.width, sImgData.height);
                    if (code && code.data) {
                        scanEl.textContent = '✅ QUÉT QR TOÀN POSTER THÀNH CÔNG: ' + code.data;
                        scanEl.style.color = '#10b981';
                    } else {
                        // Thử quét vùng khung QR trung tâm
                        const scale = 2;
                        const cropW = 380 * scale;
                        const cropH = 380 * scale;
                        const cropX = ((1080 - 380) / 2) * scale;
                        const cropY = 360 * scale;
                        const cCanvas = document.createElement('canvas');
                        cCanvas.width = cropW;
                        cCanvas.height = cropH;
                        const cCtx = cCanvas.getContext('2d');
                        cCtx.drawImage(tempImg, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
                        const cData = cCtx.getImageData(0, 0, cropW, cropH);
                        const cCode = window.jsQR(cData.data, cropW, cropH);
                        if (cCode && cCode.data) {
                            scanEl.textContent = '✅ QUÉT VÙNG QR THÀNH CÔNG: ' + cCode.data;
                            scanEl.style.color = '#10b981';
                        } else {
                            scanEl.textContent = '❌ Chưa quét được mã QR';
                            scanEl.style.color = '#ef4444';
                        }
                    }
                }
            } catch (err) {
                statusEl.textContent = 'Lỗi: ' + err.message;
                statusEl.style.color = '#ef4444';
                console.error(err);
            }
        });
    </script>
</body>
</html>
