<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Demo Widget Khách Hàng - Pastie AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: radial-gradient(circle at top left, #ffe3f1 0%, transparent 42%), radial-gradient(circle at bottom right, #fce8f4 0%, transparent 42%), #fff8fc;
            min-height: 100vh;
            padding: 40px 20px;
            color: #2c1f30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 580px;
            width: 100%;
            background: #ffffff;
            border: 1px solid rgba(239, 43, 157, 0.16);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: 0 16px 44px rgba(92, 33, 71, 0.08);
            text-align: center;
        }
        .logo-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 20px;
            background: #ffffff;
            border: 1.5px solid rgba(239, 43, 157, 0.2);
            box-shadow: 0 4px 16px rgba(239, 43, 157, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }
        .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
        h1 { color: #ef2b9d; font-size: 24px; font-weight: 800; margin-bottom: 12px; }
        p { color: #8a748d; font-size: 14.5px; line-height: 1.6; margin-bottom: 18px; }
        .hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            background: #fff0f8;
            color: #ef2b9d;
            font-size: 13px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <img src="/logoApp.png" alt="Pastie AI">
        </div>
        <h1>Pastie AI - Khung Chat Khách Hàng</h1>
        <p>Giao diện chat widget dành cho khách hàng trên website đã được đồng bộ chuẩn bảng màu <strong>Trắng & Hồng Luxury</strong>, giữ trọn nhận diện thương hiệu và tối ưu toàn diện cho thiết bị di động.</p>
        <div class="hint">
            <span>👇 Bấm vào nút chat hồng ở góc phải màn hình để thử nghiệm</span>
        </div>
    </div>
    <!-- Script Widget Trực Tiếp -->
    <script src="/chat-widget.js" data-project="dealphuquoc"></script>
</body>
</html>
